<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 388" width="1280" height="388" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration : vigilance face au démarchage et aux escroqueries">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe8d8"/>
      <stop offset="1" stop-color="#e1d6bf"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a45"/>
      <stop offset="1" stop-color="#2b3833"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="388" fill="url(#bg)"/>
  <circle cx="120" cy="60" r="70" fill="#d8c9aa" opacity="0.40"/>
  <circle cx="1180" cy="340" r="95" fill="#d8c9aa" opacity="0.38"/>

  <!-- smartphone with suspicious call -->
  <g transform="translate(95,54)">
    <rect x="0" y="0" width="210" height="280" rx="30" fill="url(#phone)"/>
    <rect x="14" y="16" width="182" height="248" rx="18" fill="#f4efe4"/>
    <rect x="74" y="30" width="62" height="9" rx="4" fill="#d9d0bf"/>
    <text x="105" y="92" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="700" fill="#2b3833" text-anchor="middle">Appel entrant</text>
    <text x="105" y="120" font-family="Montserrat, Arial, sans-serif" font-size="16" fill="#8a8273" text-anchor="middle">Numéro inconnu</text>
    <g transform="translate(105,185)">
      <path d="M 0 -42 L 50 44 L -50 44 Z" fill="#e0492f" stroke="#b8371f" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-6" y="-18" width="12" height="34" rx="6" fill="#fff"/>
      <circle cx="0" cy="29" r="7" fill="#fff"/>
    </g>
  </g>

  <!-- big warning triangle -->
  <g transform="translate(1015,194)">
    <path d="M 0 -96 L 112 100 L -112 100 Z" fill="#e0492f" stroke="#b8371f" stroke-width="7" stroke-linejoin="round"/>
    <rect x="-14" y="-42" width="28" height="78" rx="14" fill="#fff"/>
    <circle cx="0" cy="64" r="16" fill="#fff"/>
  </g>

  <!-- text block -->
  <text x="360" y="170" font-family="Montserrat, Arial, sans-serif" font-size="74" font-weight="800" fill="#2b3833" letter-spacing="1">RESTONS</text>
  <text x="360" y="252" font-family="Montserrat, Arial, sans-serif" font-size="74" font-weight="800" fill="#2b3833" letter-spacing="1">VIGILANTS</text>
  <text x="362" y="300" font-family="Montserrat, Arial, sans-serif" font-size="27" font-weight="600" fill="#8a6a3a">Démarchage &amp; escroqueries</text>
</svg>
